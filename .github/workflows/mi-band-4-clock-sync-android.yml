name: Mi Band 4 Clock Sync Android APK

on:
  push:
    paths:
      - 'tools/clock-sync-android/**'
      - '.github/workflows/mi-band-4-clock-sync-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: tools/clock-sync-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-band-4-clock-sync-apk
          path: tools/clock-sync-android/app/build/outputs/apk/debug/app-debug.apk
