CONFIG_DISPLAY=y
CONFIG_RM69XXX=y
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=4096

# BLE peripheral exposes a writable characteristic for phone time sync.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Mi Band 4 Clock"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP=n
